name: Dart

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install Flutter
      run: |
        git clone https://github.com/flutter/flutter.git -b stable --depth 1
        echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
        flutter/bin/flutter doctor

    - name: Create test directory if missing
      run: mkdir -p test

    - name: Install dependencies
      run: flutter pub get

    - name: Check for test files
      id: check_test_files
      run: |
        if [ -z "$(ls -A test/*_test.dart 2>/dev/null)" ]; then
          echo "::set-output name=test_files_found::false"
          echo "No test files found"
          exit 0
        else
          echo "::set-output name=test_files_found::true"
        fi

    - name: Run tests
      if: steps.check_test_files.outputs.test_files_found == 'true'
      run: flutter test
